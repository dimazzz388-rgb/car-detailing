  <meta charset="UTF-8" />

  <!-- React & ReactDOM -->

  <!-- Babel для JSX -->

  <link rel="manifest" href="manifest.json">

  <style>
    body {
      background-color: #0d0f12;
      color: #ffffff;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    @keyframes slideUp {
      from { transform: translateY(100%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .animate-slideUp { animation: slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    @keyframes scaleUp {
      from { transform: scale(0.92); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .animate-scaleUp { animation: scaleUp 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  </style>
</head>
<body class="bg-[#0d0f12]">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo } = React;

    const HASH_ADMIN_LOGIN = "8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918";
    const HASH_ADMIN_PASS_SERV = "34de04bdfd6bb5325ff3eb78d91c13d7890fb915e6b4faeb62c2f6d0a7a01725";
    const OBF_KEY_26 = "c2VydjI2";

    async function sha256(str) {
      const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
      return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, "0")).join("");
    }

    const formatLocalDate = (d) => {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    };

    const formatDisplayDateRu = (dateStr) => {
      if (!dateStr) return "";
      const [y, m, d] = dateStr.split("-").map(Number);
      const dt = new Date(y, m - 1, d);
      const months = ["янв.", "февр.", "марта", "апр.", "мая", "июня", "июля", "авг.", "сент.", "окт.", "нояб.", "дек."];
      return `${d} ${months[dt.getMonth()]} ${dt.getFullYear()} г.`;
    };

    /* ==========================================================================
       БАЗА ДАННЫХ СТУДИЙ И РОУТИНГ
       ========================================================================== */
    const TENANTS_DATABASE = {
      // 1. Клиент: helensstudioklin
      "helensstudioklin": {
        name: "Helen's Studio Klin",
        city: "г. Клин",
        badge: "Тонирование, оптика и оклейка авто",
        descriptor: "Качественная тонировка, полировка оптики и оклейка авто пленкой в Клину",
        address: "г. Клин (точный адрес уточняйте при записи)",
        phone: "+7 (965) 113-41-18",
        openHours: "Пн-Вс: 10:00 – 20:00",
        boxes: 2,
        heroImage: "https://images.unsplash.com/photo-1617814076367-b759c7d7e738?auto=format&fit=crop&w=1400&q=80",
        services: [
          { id: "s1", title: "Тонировка авто", duration: 3, price: 8500, desc: "Качественная тонировка стекол пленками премиум-класса с защитой от ультрафиолета" },
          { id: "s2", title: "Полировка фар", duration: 2, price: 3000, desc: "Глубокая абразивная полировка оптики с нанесением защитного слоя" },
          { id: "s3", title: "Оклейка авто пленкой", duration: 16, price: 65000, desc: "Защита кузова антигравийной полиуретановой пленкой от сколов и пескоструя" }
        ]
      },

      // 2. Демо-студия (Москва)
      "apex": {
        name: "Apex Detailing Moscow",
        city: "г. Москва",
        badge: "Гарантия на детейлинг до 5 лет",
        descriptor: "Детейлинг, который возвращает кузову глубину, а салону — чистоту",
        address: "г. Москва, ул. Зорге, д. 17А, бокс 4",
        phone: "+7 (495) 890-34-21",
        openHours: "Пн-Вс: 09:00 – 21:00",
        boxes: 3,
        heroImage: "https://images.unsplash.com/photo-1617814076367-b759c7d7e738?auto=format&fit=crop&w=1400&q=80",
        services: [
          { id: "s1", title: "Комплексная мойка", duration: 2, price: 3500, desc: "3-фазная деликатная мойка кузова, уход за арками, дисками и уборка салона" },
          { id: "s2", title: "Химчистка салона", duration: 8, price: 12000, desc: "Глубокая чистка кожи, алькантары и текстиля с консервацией защитными кремами" },
          { id: "s3", title: "Восстановительная полировка", duration: 6, price: 28000, desc: "Удаление до 95% риски и паутинки, зеркальный блеск и глубина лака" },
          { id: "s4", title: "Оклейка антигравийной пленкой (PPF)", duration: 16, price: 95000, desc: "Премиальный полиуретан 200 мкм на ударную зону или весь кузов авто" }
        ]
      }
    };

    // Определение студии по адресу ссылки (?studio=helensstudioklin или /helensstudioklin)
    const pathSlug = window.location.pathname.split("/").filter(Boolean)[0];
    const urlParams = new URLSearchParams(window.location.search);
    const querySlug = urlParams.get("studio") || urlParams.get("client");
    const currentSlug = querySlug || pathSlug || "helensstudioklin";

    const TENANT_CONFIG = TENANTS_DATABASE[currentSlug] || TENANTS_DATABASE["helensstudioklin"];

    function App() {
      // Автоматическое обновление заголовка вкладки под выбранную студию
      React.useEffect(() => {
        document.title = `${tenantConfig.name} — Онлайн-запись`;
      }, []);

      // Логика нативной установки PWA
      const [deferredPrompt, setDeferredPrompt] = useState(null);

      React.useEffect(() => {
        const handleBeforeInstallPrompt = (e) => {
          e.preventDefault();
          setDeferredPrompt(e);
        };
        window.addEventListener('beforeinstallprompt', handleBeforeInstallPrompt);
        return () => window.removeEventListener('beforeinstallprompt', handleBeforeInstallPrompt);
      }, []);

      const handleInstallClick = async () => {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          const { outcome } = await deferredPrompt.userChoice;
          if (outcome === 'accepted') {
            setDeferredPrompt(null);
          }
        } else {
          alert("Для установки на главный экран:\n• iPhone (Safari): нажмите «Поделиться» ➔ «На экран «Домой»»\n• Android (Chrome): нажмите меню (3 точки) ➔ «Добавить на главный экран»");
        }
      };

      const [activeTab, setActiveTab] = useState("home");
      
      // Настройки студии (подставляются автоматически из конфига ссылки и редактируются в админке)
      const [tenantConfig, setTenantConfig] = useState(TENANT_CONFIG);

      // Календарь исключений админа: { "2026-10-25": { isDayOff: false, disabledTimes: ["11:00"], boxesOverride: 1 } }
      const [scheduleOverrides, setScheduleOverrides] = useState({});

      const [isAdminOpen, setIsAdminOpen] = useState(false);
      const [adminAuth, setAdminAuth] = useState(false);
      const [adminLoginInput, setAdminLoginInput] = useState("");
      const [adminPassInput, setAdminPassInput] = useState("");
      const [adminAuthError, setAdminAuthError] = useState("");

      // Вкладки внутри админки: 'overview' | 'schedule' | 'services' | 'settings'
      const [adminSubTab, setAdminSubTab] = useState("overview");
      const [adminSelectedDate, setAdminSelectedDate] = useState(() => formatLocalDate(new Date()));

      // Форма новой/редактируемой услуги в админке
      const [editingServiceId, setEditingServiceId] = useState(null);
      const [srvTitleInput, setSrvTitleInput] = useState("");
      const [srvDurationInput, setSrvDurationInput] = useState("");
      const [srvPriceInput, setSrvPriceInput] = useState("");
      const [srvDescInput, setSrvDescInput] = useState("");

      const [bookings, setBookings] = useState([
        {
          id: "BK-9042",
          serviceTitle: TENANT_CONFIG.services[0].title,
          clientName: "Владимир Романов",
          clientPhone: "+7 (985) 111-22-33",
          carModel: "Porsche Taycan 4S",
          date: "2026-10-24",
          time: "10:00",
          box: 2,
          price: TENANT_CONFIG.services[0].price,
          status: "confirmed"
        }
      ]);

      const [myBookingIds, setMyBookingIds] = useState(() => {
        try { return JSON.parse(localStorage.getItem("apex_bookings_ids") || "[]"); } catch { return []; }
      });

      const saveBookingLocally = (id) => {
        const updated = Array.from(new Set([id, ...myBookingIds]));
        setMyBookingIds(updated);
        try { localStorage.setItem("apex_bookings_ids", JSON.stringify(updated)); } catch(e){}
      };

      const [bookingStep, setBookingStep] = useState(1);
      const [selectedService, setSelectedService] = useState(null);
      const [selectedDate, setSelectedDate] = useState(() => formatLocalDate(new Date()));
      const [selectedTime, setSelectedTime] = useState("");
      const [clientName, setClientName] = useState("");
      const [clientPhone, setClientPhone] = useState("");
      const [carModel, setCarModel] = useState("");
      const [lastConfirmedBooking, setLastConfirmedBooking] = useState(null);
      const [cancelModalBooking, setCancelModalBooking] = useState(null);

      const [isServiceSheetOpen, setIsServiceSheetOpen] = useState(false);
      const [consentChecked, setConsentChecked] = useState(false);

      const [searchQuery, setSearchQuery] = useState("");
      const [searchedBookings, setSearchedBookings] = useState(null);

      const [chatMessages, setChatMessages] = useState([
        { role: "assistant", text: "Здравствуйте! Я AI-консультант студии. Могу сориентировать по стоимости, длительности работ или подобрать свободное время." }
      ]);
      const [chatInput, setChatInput] = useState("");

      const handlePhoneInput = (e) => {
        let val = e.target.value.replace(/\D/g, "");
        if (val.startsWith("7") || val.startsWith("8")) val = val.slice(1);
        val = val.slice(0, 10);

        let res = "+7";
        if (val.length > 0) res += " (" + val.substring(0, 3);
        if (val.length >= 3) res += ") " + val.substring(3, 6);
        if (val.length >= 6) res += "-" + val.substring(6, 8);
        if (val.length >= 8) res += "-" + val.substring(8, 10);
        setClientPhone(res);
      };

      const daysList = useMemo(() => {
        const arr = [];
        const base = new Date();
        const names = ["Вс", "Пн", "Вт", "Ср", "Чт", "Пт", "Сб"];
        for (let i = 0; i < 7; i++) {
          const d = new Date(base.getFullYear(), base.getMonth(), base.getDate() + i);
          arr.push({
            dateStr: formatLocalDate(d),
            dayName: names[d.getDay()],
            dayNum: d.getDate()
          });
        }
        return arr;
      }, []);

      const timeSlots = ["09:00", "11:00", "13:00", "15:00", "17:00", "19:00"];

      // Проверка доступности слота с учетом переопределений админа на этот день
      const checkAvailability = (time) => {
        const override = scheduleOverrides[selectedDate];
        if (override && override.isDayOff) {
          return { isFree: false, freeCount: 0, assignedBox: null, isDayOff: true };
        }
        if (override && override.disabledTimes && override.disabledTimes.includes(time)) {
          return { isFree: false, freeCount: 0, assignedBox: null };
        }

        const activeBoxesLimit = (override && override.boxesOverride !== undefined && override.boxesOverride !== "") 
          ? Number(override.boxesOverride) 
          : tenantConfig.boxes;

        const count = bookings.filter((b) => b.date === selectedDate && b.time === time && b.status !== "cancelled").length;
        const free = activeBoxesLimit - count;
        return { isFree: free > 0, freeCount: free, assignedBox: free > 0 ? count + 1 : null };
      };

      const handleConfirm = () => {
        if (!selectedService || !selectedDate || !selectedTime || !clientName || !clientPhone || !consentChecked) return;
        const { isFree, assignedBox } = checkAvailability(selectedTime);
        if (!isFree) {
          alert("К сожалению, это время недоступно для записи. Пожалуйста, выберите другое окно.");
          return;
        }

        const newB = {
          id: `BK-${Math.floor(1000 + Math.random() * 9000)}`,
          serviceId: selectedService.id,
          serviceTitle: selectedService.title,
          clientName: clientName.trim(),
          clientPhone: clientPhone.trim(),
          carModel: carModel.trim() || "Не указан",
          date: selectedDate,
          time: selectedTime,
          box: assignedBox,
          price: selectedService.price,
          status: "confirmed"
        };

        setBookings((prev) => [newB, ...prev]);
        saveBookingLocally(newB.id);
        setLastConfirmedBooking(newB);
        setBookingStep(5);
      };

      const handleCancelBooking = () => {
        if (!cancelModalBooking) return;
        setBookings((prev) => prev.map((b) => b.id === cancelModalBooking.id ? { ...b, status: "cancelled" } : b));
        setCancelModalBooking(null);
      };

      const executeSearch = () => {
        const digits = searchQuery.replace(/\D/g, "");
        if (digits.length < 10 && !searchQuery.toUpperCase().startsWith("BK-")) {
          alert("Введите полный номер телефона (10 цифр) или код брони (BK-XXXX)");
          return;
        }
        const filtered = bookings.filter((b) => {
          const bDig = b.clientPhone.replace(/\D/g, "");
          return bDig.endsWith(digits) || b.id.toUpperCase() === searchQuery.trim().toUpperCase();
        });
        setSearchedBookings(filtered);
      };

      const handleAdminSubmit = async (e) => {
        e.preventDefault();
        const lH = await sha256(adminLoginInput.trim());
        const pH = await sha256(adminPassInput.trim());
        const p26H = await sha256(atob(OBF_KEY_26));

        if (lH === HASH_ADMIN_LOGIN && (pH === HASH_ADMIN_PASS_SERV || pH === p26H)) {
          setAdminAuth(true);
          setAdminAuthError("");
        } else {
          setAdminAuthError("Неверный логин или пароль администратора");
        }
      };

      const sendAssistant = (query) => {
        const u = { role: "user", text
