      const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
      return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, "0")).join("");

      return `${d} ${months[dt.getMonth()]} ${dt.getFullYear()} г.`;

                      <div className="space-y-3 text-xs">
                        <div>
                          <label className="text-white/50 block mb-1">Название студии (name)</label>
                          <input
                            type="text"
                            value={tenantConfig.name}
                            onChange={(e) => setTenantConfig({...tenantConfig, name: e.target.value})}
                            className="w-full bg-white/[0.04] border border-white/10 rounded-xl px-3.5 py-2 text-white outline-none"
                          />
                        </div>
                        <div>
                          <label className="text-white/50 block mb-1">Город (city)</label>
                          <input
                            type="text"
                            value={tenantConfig.city}
                            onChange={(e) => setTenantConfig({...tenantConfig, city: e.target.value})}
                            className="w-full bg-white/[0.04] border border-white/10 rounded-xl px-3.5 py-2 text-white outline-none"
                          />
                        </div>
                        <div>
                          <label className="text-white/50 block mb-1">Адрес (address)</label>
                          <input
                            type="text"
                            value={tenantConfig.address}
                            onChange={(e) => setTenantConfig({...tenantConfig, address: e.target.value})}
                            className="w-full bg-white/[0.04] border border-white/10 rounded-xl px-3.5 py-2 text-white outline-none"
                          />
                        </div>
                        <div>
                          <label className="text-white/50 block mb-1">Телефон (phone)</label>
                          <input
                            type="text"
                            value={tenantConfig.phone}
                            onChange={(e) => setTenantConfig({...tenantConfig, phone: e.target.value})}
                            className="w-full bg-white/[0.04] border border-white/10 rounded-xl px-3.5 py-2 text-white outline-none"
                          />
                        </div>
                        <div>
                          <label className="text-white/50 block mb-1">Количество боксов по умолчанию (boxes)</label>
                          <input
                            type="number"
                            min="1"
                            max="10"
                            value={tenantConfig.boxes}
                            onChange={(e) => setTenantConfig({...tenantConfig, boxes: Number(e.target.value) || 1})}
                            className="w-full bg-white/[0.04] border border-white/10 rounded-xl px-3.5 py-2 text-white outline-none"
                          />
                        </div>
                        <button
                          onClick={() => alert("Настройки успешно обновлены!")}
                          className="w-full py-2.5 rounded-xl bg-[#008CFF] text-white font-semibold text-xs mt-2"
                        >
                          Сохранить изменения
                        </button>
                      </div>
                    )}
                  </div>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
